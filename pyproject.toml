[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sdlc-factory"
version = "0.1.0"
description = "A durable, model-independent software delivery workflow"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
sdlc-factory = "factory.__main__:main"

[tool.setuptools.packages.find]
include = ["factory*"]

